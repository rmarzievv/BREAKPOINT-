name: breakpoint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: make test
      - name: Reproduce frozen DCC claims from pinned inputs
        run: |
          make fetch pilot dcc
          git diff --exit-code data/pilot_implementations.csv data/pilot_rules.csv data/dcc_claims.csv
